<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mnt | Dreaming Galaxy</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: #0d0e12;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow-x: hidden;
            padding: 20px;
        }

        .space-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 10% 20%, rgba(40, 45, 65, 0.5) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(30, 35, 50, 0.6) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, #13151c 0%, #08090c 100%);
            z-index: -2;
        }

        .clouds {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(180px 140px at 15% 15%, rgba(255, 255, 255, 0.04), transparent 70%),
                radial-gradient(250px 200px at 85% 85%, rgba(255, 255, 255, 0.05), transparent 70%),
                radial-gradient(200px 150px at 80% 10%, rgba(255, 255, 255, 0.03), transparent 70%);
            z-index: -1;
        }

        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(1.5px 1.5px at 20px 30px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 70px 150px, #e0e0e0, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 150px 40px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 220px 280px, #cccccc, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 310px 120px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 400px 320px, #ffffff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 350px 350px;
            opacity: 0.8;
            animation: twinkle 3s infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: rgba(22, 24, 30, 0.7);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            padding: 35px 22px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
            text-align: center;
            position: relative;
            z-index: 1;
        }
