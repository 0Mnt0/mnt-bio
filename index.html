<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mnt | Dreaming Galaxy</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: #0b0914;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow-x: hidden;
            padding: 20px;
        }

        .space-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #1b1430 0%, #0b0914 100%);
            z-index: -1;
            overflow: hidden;
        }

        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 90px 40px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 160px 120px, #d4bfff, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 230px 180px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 320px 250px, #a582ff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 350px 350px;
            opacity: 0.6;
            animation: twinkle 5s infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.4; }
            100% { opacity: 0.8; }
        }

        .container {
            width: 100%;
            max-width: 440px;
            background: rgba(26, 21, 46, 0.55);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(165, 130, 255, 0.2);
            border-radius: 28px;
            padding: 35px 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 0 0 20px rgba(165, 130, 255, 0.1);
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .avatar-container {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 15px auto;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(212, 191, 255, 0.5);
            box-shadow: 0 0 20px rgba(165, 130, 255, 0.4);
        }

        .profile-name {
            font-size: 26px;
            font-weight: 700;
            color: #f0ebff;
            margin-bottom: 8px;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(165, 130, 255, 0.5);
        }

        .profile-bio {
            font-size: 14px;
            color: #bfaee3;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .links-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(43, 34, 77, 0.6);
            border: 1px solid rgba(165, 130, 255, 0.25);
            padding: 14px 20px;
            border-radius: 16px;
            color: #ffffff;
            text-decoration: none;
            font-weight: 500;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .link-btn:hover {
            background: rgba(69, 54, 122, 0.8);
            border-color: rgba(212, 191, 255, 0.6);
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(165, 130, 255, 0.3);
        }

        .link-content {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .link-icon {
            font-size: 20px;
        }

        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #8c7ba8;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="space-bg">
        <div class="stars"></div>
    </div>

    <div class="container">
        <div class="avatar-container">
            <img src="بستي.jpg" alt="Mnt" class="avatar">
        </div>

        <h1 class="profile-name">Mnt</h1>
        <p class="profile-bio">مكاننا البسيط يحلى بوجودك 🌌✨</p>

        <div class="links-list">
            <!-- قناة الكيك -->
            <a href="https://kick.com/0mnt0" target="_blank" class="link-btn">
                <div class="link-content">
                    <span class="link-icon">📺</span>
                    <span>قناة Kick</span>
                </div>
                <span>➔</span>
            </a>

            <!-- سيرفر الديسكورد -->
            <a href="https://discord.gg/MGJPFpqEr" target="_blank" class="link-btn">
                <div class="link-content">
                    <span class="link-icon">💬</span>
                    <span>سيرفر الديسكورد</span>
                </div>
                <span>➔</span>
            </a>

            <!-- تيك توك -->
            <a href="https://www.tiktok.com/@1mlkl" target="_blank" class="link-btn">
                <div class="link-content">
                    <span class="link-icon">🎵</span>
                    <span>تيك توك</span>
                </div>
                <span>➔</span>
            </a>

            <!-- رابط الدعم -->
            <a href="https://creators.sa/0mnt0" target="_blank" class="link-btn">
                <div class="link-content">
                    <span class="link-icon">💜</span>
                    <span>دعم القناة (Tips)</span>
                </div>
                <span>➔</span>
            </a>
        </div>

        <div class="footer">
            Dreaming Galaxy © 2026
        </div>
    </div>

</body>
</html>
